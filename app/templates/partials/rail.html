<aside class="rail">
  <a class="brand" href="/dashboard">
    <svg class="brand__mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
      <path d="M4 5.5h9.5a5 5 0 0 1 0 10H9l-5 4.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
      <path d="M8 9.5h6M8 12.5h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
    </svg>
    <span class="brand__name">{{ product_name }}</span>
  </a>

  <nav class="rail__nav" aria-label="Primary">
    <a class="rail__link" href="/dashboard"{% if request.url.path.startswith('/dashboard') or request.url.path.startswith('/releases') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <span>Release history</span>
    </a>
    <a class="rail__link" href="/releases/new"{% if request.url.path in ('/composer', '/releases/new') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <span>New release</span>
    </a>
  </nav>

  <div class="rail__account">
    <p class="rail__label">Signed in as</p>
    <p class="rail__email" title="{{ current_user.email }}">{{ current_user.email }}</p>
    <form method="post" action="/auth/signout">
      <button class="btn btn--ghost btn--sm btn--block" type="submit">Sign out</button>
    </form>
  </div>
</aside>
